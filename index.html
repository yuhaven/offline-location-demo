<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>极端定位 · 无网无星</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">无网络 · 无卫星</p>
      <h1>我在哪</h1>
      <p class="sub">相对起点的位移与朝向。不是绝对经纬度。</p>
    </header>

    <section class="status" id="statusBox" aria-live="polite">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">点下方开始</span>
    </section>

    <section class="hero">
      <div class="metric">
        <div class="label">离起点</div>
        <div class="value" id="distance">0</div>
        <div class="unit">米</div>
      </div>
      <div class="metric">
        <div class="label">朝向</div>
        <div class="value" id="heading">—</div>
        <div class="unit">度</div>
      </div>
    </section>

    <p class="hint" id="hint">一步：允许运动/方向传感器后走动，数字会跟着变。</p>

    <div class="actions">
      <button type="button" class="primary" id="btnStart">开始定位</button>
      <button type="button" class="ghost" id="btnReset">重置起点</button>
      <button type="button" class="sos" id="btnSos">生成求救短句</button>
    </div>

    <section class="sos-box" hidden id="sosBox">
      <div class="label">求救短句（可复制）</div>
      <textarea id="sosText" readonly rows="4"></textarea>
      <button type="button" class="ghost" id="btnCopy">复制</button>
    </section>

    <p class="warn">仅相对定位，不作救援绝对坐标承诺。误差会随走动增大。</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
